<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="500" viewBox="0 0 1440 500" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1440" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111B2E"/>
      <stop offset="0.56" stop-color="#243B5B"/>
      <stop offset="1" stop-color="#355779"/>
    </linearGradient>
    <linearGradient id="orb" x1="960" y1="76" x2="1368" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C0F4DC"/>
      <stop offset="1" stop-color="#9BB9FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="matrix(0 252 -346 0 1247 245)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#76D7C0" stop-opacity=".17"/>
      <stop offset="1" stop-color="#76D7C0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" stroke="#D8E7FA" stroke-opacity=".055"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1440" height="500" rx="28" fill="url(#bg)"/>
  <rect width="1440" height="500" rx="28" fill="url(#grid)"/>
  <rect width="1440" height="500" rx="28" fill="url(#glow)"/>

  <circle cx="1240" cy="252" r="145" fill="#70D8C3" fill-opacity=".12" filter="url(#soft)"/>
  <g stroke="url(#orb)" stroke-width="2.2" opacity=".82">
    <ellipse cx="1220" cy="250" rx="173" ry="66" transform="rotate(-32 1220 250)"/>
    <ellipse cx="1220" cy="250" rx="173" ry="66" transform="rotate(32 1220 250)"/>
    <ellipse cx="1220" cy="250" rx="173" ry="66" transform="rotate(90 1220 250)"/>
  </g>
  <circle cx="1220" cy="250" r="11" fill="#E8FFF4"/>
  <circle cx="1220" cy="250" r="5" fill="#67D9B8"/>
  <circle cx="1066" cy="166" r="8" fill="#FFC98B"/>
  <circle cx="1351" cy="204" r="7" fill="#C4D6FF"/>
  <circle cx="1279" cy="404" r="8" fill="#B8F0D7"/>

  <path d="M984 390C1013 390 1019 352 1048 352s35 72 64 72 35-99 64-99 35 65 64 65" stroke="#B7D4FF" stroke-opacity=".76" stroke-width="3" stroke-linecap="round"/>
  <path d="M975 413H1252" stroke="#D6E4F5" stroke-opacity=".23"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="88" y="94" fill="#A9DCCC" font-size="17" font-weight="700" letter-spacing="4">ОҚУ • ТӘЖІРИБЕ • ЗЕРТТЕУ</text>
    <text x="82" y="218" fill="#F8FAFC" font-size="76" font-weight="750" letter-spacing="-2">Физика —</text>
    <text x="82" y="306" fill="#F8FAFC" font-size="76" font-weight="750" letter-spacing="-2">көз алдыңда.</text>
    <text x="88" y="365" fill="#D5E2F1" font-size="24">Оқы. Тәжірибе жаса. ҰБТ-ға дайындал.</text>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">
    <rect x="88" y="414" width="150" height="38" rx="19" fill="#E6F7EF" fill-opacity=".12" stroke="#BDEBD7" stroke-opacity=".35"/>
    <text x="110" y="438" fill="#DFF8EB">25 ТАҚЫРЫП</text>
    <rect x="251" y="414" width="125" height="38" rx="19" fill="#E6F7EF" fill-opacity=".12" stroke="#BDEBD7" stroke-opacity=".35"/>
    <text x="276" y="438" fill="#DFF8EB">3 ТІЛ</text>
    <rect x="389" y="414" width="151" height="38" rx="19" fill="#E6F7EF" fill-opacity=".12" stroke="#BDEBD7" stroke-opacity=".35"/>
    <text x="415" y="438" fill="#DFF8EB">ВИРТУАЛ ЗЕРТХАНА</text>
  </g>
</svg>

